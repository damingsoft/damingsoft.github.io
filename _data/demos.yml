# 与「条码结构图解」同属「把符号内部摊开看」的一类，所以排在一起：
# 结构图解回答「哪一位管什么」，这一条回答「纠错码字到底能扛多少损伤」。
- slug: qr-error-correction-visualizer
  title: 在线 QR 纠错能力可视化工具
  title_en: Online QR Error Correction Visualizer
  category: developer-tools
  url: https://www.dynamsoft.com/codepool/demos/qr-error-correction-visualizer/
  image: /assets/demos/qr-error-correction-visualizer.jpg
  description: >-
    按 L / M / Q / H 纠错级别生成 QR Code，看清 Reed-Solomon 校验码字究竟买到了什么：
    逐模块涂改、盖住定位与时序图形，或模拟噪点、模糊、低对比度、遮挡、裁切、阴影与倾斜。
    实时仪表按分块统计损坏与可修复的码字数，同时用 Dynamsoft Barcode Reader 解码受损图像；
    从 0 到 25% 的固定种子扫描标出每个级别停止恢复的位置，每一步都留存被解码图像的 PNG。
    反推也成立：丢进一张不是它生成的二维码图片，页面会定位网格、读出格式信息，
    报告 Reed-Solomon 实际修复了多少码字，并在仍可解码时把损伤折算成同一尺度的百分比。
    全部在浏览器内完成。
  capabilities:
    - QR Code
    - 纠错
    - Reed-Solomon
    - 结构视图
    - 解码测试
    - 损伤分析
  updated: '2026-10-16'
