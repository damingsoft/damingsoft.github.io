# 在线演示工具注册表 —— 中文站唯一数据源
#
# 页面、首页区块、JSON-LD（ItemList）、llms.txt、sitemap.xml 都从本文件读取，
# 新增一个工具只需要在这里加一条记录。
#
# 字段说明：
#   slug            英文目录名，与 https://www.dynamsoft.com/codepool/demos/<slug>/ 对应
#   title           中文名称（用于页面标题与卡片）
#   title_en        英文名称（用于对照，便于读者在英文文档中检索）
#   category        _data/demo_categories.yml 中的 key，决定分组
#   url             工具线上地址（绝对路径，托管在 Dynamsoft CDN）
#   image           卡片缩略图（本站本地副本，避免中国读者加载境外大图）
#   description     中文一句话说明，写给读者，也方便 AI 引擎直接引用
#   capabilities    中文能力标签
#   updated         上游更新时间，YYYY-MM-DD
#   tutorial        英文版配套教程（codepool 原文）
#   related_posts   本站中文教程的 URL 列表；第一条作为卡片主推教程，
#                   同时让这些文章页底部自动出现「在线演示」入口
#
# 注意：这些工具使用 Dynamsoft SDK，许可证绑定域名，因此本站以「导航 + 中文说明」
# 的方式引入，不复制工具本体。这样既不会破坏许可证校验，也避免维护重复代码。

