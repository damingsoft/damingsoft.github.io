{%- comment -%}
  /demos/ 页面的工具清单。数据源是 _data/demos.yml，所以新增工具后
  这份机器可读清单会自动跟着变。

  每个工具声明成 WebApplication（isAccessibleForFree），而不是普通的
  ListItem 链接：这样"这些页面是能直接用的工具"这件事对搜索引擎和
  AI 引擎都是明确的，而不只是九个网址。
{%- endcomment -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ItemList",
  "name": {{ page.title | jsonify }},
  "description": {{ page.description | strip_newlines | jsonify }},
  "numberOfItems": {{ site.data.demos | size }},
  "itemListElement": [
    {%- for demo in site.data.demos %}
    {
      "@type": "ListItem",
      "position": {{ forloop.index }},
      "item": {
        "@type": "WebApplication",
        "name": {{ demo.title | jsonify }},
        "alternateName": {{ demo.title_en | jsonify }},
        "url": {{ demo.url | jsonify }},
        "description": {{ demo.description | strip_newlines | jsonify }},
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Web browser",
        "browserRequirements": "Requires JavaScript and a camera for the scanning tools",
        "inLanguage": ["zh-CN", "en"],
        "isAccessibleForFree": true,
        "publisher": { "@id": "{{ site.url }}/#organization" }
      }
    }{% unless forloop.last %},{% endunless %}
    {%- endfor %}
  ]
}
</script>
