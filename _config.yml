title: 大名维森软件开发者博客
author: 大名维森软件
email: support@damingsoft.com
description: > # this means to ignore newlines until "show_exerpts:"
  大名维森软件的开发者博客。大名维森软件的主要产品是文档扫描和图像处理SDK。
# Absolute site URL. Required by jekyll-seo-tag (canonical / og:url) and by
# sitemap.xml. Without it those tags were emitted relative ("/post/") or dropped
# entirely, which is why the sitemap used to contain an empty <loc></loc>.
url: "https://devblogs.damingsoft.com"
# Feeds <meta property="og:locale"> and the RSS channel language.
lang: zh-CN
# Organization logo, used by the JSON-LD Organization node.
logo: /assets/portfolio.png
# Share cards: /assets/og/ holds the 1200x630 covers.
twitter:
  card: summary_large_image
show_excerpts: true # set to true to show excerpts on the homepage
locale: zh_CN
paginate: 10
# Minima date format
# refer to http://shopify.github.io/liquid/filters/date/ if you want to customize this
sass:
  sass_dir: _sass
plainwhite:
  name: 首页
  tagline: 文档扫描与图像处理
  date_format: "%Y年%-m月%-d日"
  sitemap: true # set to true to generate sitemap.xml content
  search: true # set to true to enable searchbar
  dark_mode: false # set to true to add dark mode toggle
  portfolio_image: "assets/portfolio.png" # the path from the base directory of the site to the image to display (no / at the start)
  html_lang: "zh" # set the lang attribute of the <html> tag for the pages. See here for a list of codes: https://www.w3schools.com/tags/ref_country_codes.asp
  condensed_mobile:
    #- home
    - page
    - post
  # Navigation is rendered once, at the top of the sidebar
  # (see _includes/site-nav.html). It is deliberately not repeated in the footer.
  navigation:
    - title: 首页
      url: /
    - title: 在线演示工具
      url: /demos/
    - title: 分类
      url: /categories/
    - title: 标签
      url: /tags/
  # generate social links in footer
  social_links:
    #twitter: samarsault
    github:  damingsoft
    #linkedIn: in/samarsault
    rss: rss
    #dribbble: jekyll
    #flickr:   jekyll
    #instagram: jekyll
    #pinterest: jekyll
    #youtube:   jekyll
    #facebook:  jekyll
    #soundcloud: jekyll
    #telegram:  jekyll
    #gitlab:    jekyll
    #email:     jekyll

    # Mastodon instances
    # mastodon:
    # - username: jekyll
    #   instance: example.com
    # - username: jekyll2
    #   instance: example.com

# If you want to link only specific pages in your header, uncomment
# this and add the path to the pages in order as they should show up
#header_pages:
# - about.md
permalink: /:title/

# Default social cover for every post. Posts carry no `image` of their own, so
# without this every share card and every Article rich result was imageless.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      image: /assets/og/og-default.png

# Build settings
# theme: plainwhite

plugins:
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-feed
